name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate every cursor frame
        run: python -m unittest discover -s tests -v
      - name: Build release and verify with Windows cursor loader
        shell: powershell
        run: |
          $version = '1.0.0'
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $version = $env:GITHUB_REF_NAME.TrimStart('v') }
          ./tools/Build.ps1 -Version $version
      - name: Exercise install, upgrade, recovery and uninstall
        shell: powershell
        run: |
          $package = Get-ChildItem dist -Directory | Select-Object -First 1
          ./tests/Test-Lifecycle.ps1 -PackageDirectory $package.FullName
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-release
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Windows-release
          path: dist
      - name: Publish ZIP and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Hearth Glove Cursor $GITHUB_REF_NAME" --generate-notes
